<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="theme-color" content="#5B2C8A"/>
<title>مدیریت کلاس بشری</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:linear-gradient(165deg,#f8f5fc 0%,#efe8f7 55%,#f3eef9 100%);color:#1f1235;
  font-family:Tahoma,"Vazirmatn",Arial,sans-serif;font-size:16px;line-height:1.6;
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
#app{min-height:100%;min-height:100dvh;padding-bottom:calc(var(--kb,0px) + 1.5rem);transition:padding-bottom .15s ease}
.card{background:#fff;border-radius:1.1rem;box-shadow:0 6px 24px rgba(91,44,138,.09);border:1px solid #ebe0f5}
.btn-p{background:linear-gradient(135deg,#5B2C8A,#7d3fad);color:#fff;border:0;cursor:pointer;font-family:inherit}
.btn-d{background:#fee2e2;color:#b91c1c;border:0;cursor:pointer;font-family:inherit}
.btn-g{background:#dcfce7;color:#166534;border:0;cursor:pointer;font-family:inherit}
input,select,textarea{border:1.5px solid #d4b8eb;border-radius:.75rem;padding:.85rem 1rem;width:100%;font-size:1rem;
  background:#fff;outline:none;font-family:inherit;color:#1f1235}
input:focus,select:focus,textarea:focus{border-color:#5B2C8A;box-shadow:0 0 0 3px rgba(91,44,138,.12);scroll-margin:160px}
.inp-lg{min-height:3.25rem}
label.lbl{font-size:.82rem;color:#5B2C8A;font-weight:600;margin-bottom:.3rem;display:block}
.gap-form{display:flex;flex-direction:column;gap:.9rem}
th{background:#5B2C8A;color:#fff;padding:.65rem .45rem;font-size:.78rem;white-space:nowrap}
td{padding:.55rem .4rem;border-bottom:1px solid #f0e8f7;text-align:center;font-size:.86rem}
table{width:100%;border-collapse:collapse}
.logo{border-radius:50%;object-fit:cover}
img.logo{background:transparent!important}
.toast{position:fixed;bottom:calc(1.4rem + var(--kb,0px));left:50%;transform:translateX(-50%);z-index:400;
  padding:.85rem 1.35rem;border-radius:.9rem;color:#fff;max-width:92vw;font-size:.92rem;display:none;background:#5B2C8A}
.toast.show{display:block}
.toast.err{background:#b91c1c}
.modal-bg{background:rgba(42,20,64,.55)}
.hidden{display:none!important}
.tab-on{border-bottom:3px solid #fff;font-weight:700}
.hdr{padding-top:1.15rem;padding-bottom:.85rem}
.hdr-title{font-size:1.05rem;line-height:1.5;font-weight:700;margin-top:.15rem}
.hdr-sub{font-size:.78rem;opacity:.92;margin-top:.15rem}
.nav-btn{padding:.7rem .85rem;font-size:.86rem;white-space:nowrap;background:transparent;border:0;
  color:rgba(255,255,255,.9);cursor:pointer;font-family:inherit}
.bg-brand-600{background:#5B2C8A}
.text-brand-700{color:#4a2470}.text-brand-600{color:#5B2C8A}
.text-gray-500{color:#6b7280}.text-gray-600{color:#4b5563}.text-gray-400{color:#9ca3af}
.text-red-600{color:#dc2626}.text-white{color:#fff}.text-center{text-align:center}.text-right{text-align:right}
.font-bold{font-weight:700}.font-extrabold{font-weight:800}
.text-xs{font-size:.75rem}.text-sm{font-size:.875rem}.text-base{font-size:1rem}.text-xl{font-size:1.25rem}
.p-3{padding:.75rem}.p-4{padding:1rem}.p-5{padding:1.25rem}.p-7{padding:1.75rem}
.px-2{padding-left:.5rem;padding-right:.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-2\.5{padding-top:.625rem;padding-bottom:.625rem}
.py-3{padding-top:.75rem;padding-bottom:.75rem}.py-3\.5{padding-top:.875rem;padding-bottom:.875rem}
.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mt-1{margin-top:.25rem}.mt-1\.5{margin-top:.375rem}.mt-2{margin-top:.5rem}
.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.w-full{width:100%}.max-w-md{max-width:28rem}.max-w-sm{max-width:24rem}.max-w-3xl{max-width:48rem}.mx-auto{margin-left:auto;margin-right:auto}
.flex{display:flex}.grid{display:grid}.grid-cols-2{grid-template-columns:1fr 1fr}.grid-cols-3{grid-template-columns:1fr 1fr 1fr}
.gap-2{gap:.5rem}.gap-2\.5{gap:.625rem}.gap-3{gap:.75rem}
.items-center{align-items:center}.items-start{align-items:flex-start}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-1{flex:1}.shrink-0{flex-shrink:0}.overflow-x-auto{overflow-x:auto}
.sticky{position:sticky}.fixed{position:fixed}.inset-0{top:0;right:0;bottom:0;left:0}.top-0{top:0}.z-40{z-index:40}.z-50{z-index:50}
.min-h-screen{min-height:100vh;min-height:100dvh}.space-y-2>*+*{margin-top:.5rem}.border-b{border-bottom:1px solid #ebe0f5}
.bg-brand-100{background:#efe8f7}.bg-white\/20{background:rgba(255,255,255,.2)}
header .nav-wrap{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div id="app"><div style="padding:2.5rem;text-align:center;color:#5B2C8A;font-weight:700">در حال بارگذاری…</div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
